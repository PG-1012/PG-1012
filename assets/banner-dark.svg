roke="#21262D" stroke-width="1"/><line x1="0" y1="80" x2="1000" y2="80" stroke="#21262D" stroke-width="1"/><line x1="0" y1="120" x2="1000" y2="120" stroke="#21262D" stroke-width="1"/><line x1="0" y1="160" x2="1000" y2="160" stroke="#21262D" stroke-width="1"/><line x1="0" y1="200" x2="1000" y2="200" stroke="#21262D" stroke-width="1"/><line x1="0" y1="240" x2="1000" y2="240" stroke="#21262D" stroke-width="1"/></g>

